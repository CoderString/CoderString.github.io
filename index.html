<!doctype html>
<html lang="zh-CN" data-theme="dark">
<script>(function(){try{var t=localStorage.getItem('marketViewTheme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;var c=localStorage.getItem('marketViewColor');if(c==='cn')document.documentElement.dataset.color='cn';}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <title>Market View — 金融行情看板</title>
  <link rel="stylesheet" href="styles.css?v=20261124-ui-v18" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
<script src="config.js?v=3"></script>
<script>
(function(){
  var KEY='marketViewAuth';
  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
  function hash(pw){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('mv-salt:'+pw)).then(hex)}
  window.MarketAuth={hash:function(pw){return hash(pw).then(function(h){console.log(h);return h})},logout:function(){localStorage.removeItem(KEY);location.reload()}};
  var target=String(window.MARKET_ACCESS_HASH||'');
  if(!target)return;
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.h===target&&s.exp>Date.now())return;}catch(e){}
  document.documentElement.classList.add('auth-locked');
  document.addEventListener('DOMContentLoaded',function(){
    var g=document.createElement('div');g.className='auth-gate';
    g.innerHTML='<form class="auth-card" autocomplete="off"><span class="brand-mark"><i></i><i></i><i></i></span><h1>Market View</h1><p>请输入访问密码</p><input type="password" id="auth-input" placeholder="访问密码" aria-label="访问密码" autofocus><label class="auth-remember"><input type="checkbox" id="auth-remember" checked> '+(window.MARKET_ACCESS_DAYS||7)+' 天内免输入</label><button type="submit">进入</button><div class="auth-error" id="auth-error" role="alert"></div></form>';
    document.body.appendChild(g);
    var input=g.querySelector('#auth-input');setTimeout(function(){input.focus()},50);
    g.querySelector('form').addEventListener('submit',function(e){
      e.preventDefault();
      hash(input.value).then(function(h){
        if(h!==target){var err=g.querySelector('#auth-error');err.textContent='密码不正确';g.querySelector('.auth-card').classList.remove('shake');void g.offsetWidth;g.querySelector('.auth-card').classList.add('shake');input.select();return;}
        var days=g.querySelector('#auth-remember').checked?(window.MARKET_ACCESS_DAYS||7):0.5/24;
        localStorage.setItem(KEY,JSON.stringify({h:h,exp:Date.now()+days*864e5}));
        document.documentElement.classList.remove('auth-locked');g.remove();
      });
    });
  });
})();
</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Market View 首页">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span>Market<span>View</span></span>
    </a>

    <label class="search-wrap" for="global-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      <input id="global-search" type="search" autocomplete="off" placeholder="搜索名称或代码" />
      <kbd>⌘ K</kbd>
    </label>

    <div class="top-actions">
      <div class="market-status"><span class="status-dot"></span><span id="market-status-text">美股开盘中</span></div>
      <button class="icon-btn" id="refresh-btn" title="刷新行情" aria-label="刷新行情">
        <svg id="refresh-icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7"></path><path d="M20 4v7h-7"></path></svg>
      </button>
      <button class="icon-btn color-toggle" id="color-btn" title="切换涨跌配色" aria-label="切换涨跌配色"><span class="c-up">涨</span><span class="c-down">跌</span></button>
      <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
        <svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>
        <svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"></path></svg>
      </button>
    </div>
  </header>

  <nav class="category-nav" aria-label="市场分类">
    <div class="category-tabs" id="category-tabs"></div>
  </nav>

  <main class="main-content" id="main-content">
    <div id="loading-state" class="loading-grid" aria-label="正在加载行情">
      <div class="skeleton hero-skeleton"></div>
      <div class="skeleton asset-skeleton"></div>
      <div class="skeleton asset-skeleton"></div>
      <div class="skeleton asset-skeleton"></div>
      <div class="skeleton asset-skeleton"></div>
    </div>

    <div id="app-content" hidden>
      <div class="page-heading">
        <div>
          <p class="eyebrow" id="page-eyebrow">MARKET OVERVIEW</p>
          <h1 id="page-title">市场总览</h1>
        </div>
        <div class="heading-side">
          <button class="add-favorite-btn" id="add-favorite-btn" type="button" title="添加自选">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>添加自选</span>
          </button>
          <div class="auto-refresh" title="自动刷新行情">
            <span class="live-dot" id="live-dot"></span>
            <select id="auto-refresh-select" aria-label="自动刷新间隔">
              <option value="0">自动刷新：关</option>
              <option value="10">每 10 秒</option>
              <option value="30">每 30 秒</option>
              <option value="60">每 1 分钟</option>
              <option value="300">每 5 分钟</option>
            </select>
            <em id="refresh-countdown"></em>
          </div>
          <div class="update-box">
            <span>最后更新时间</span>
            <strong id="last-update">--:--:--</strong>
          </div>
        </div>
      </div>

      <div id="alert-bar" class="alert-bar" hidden>
        <span id="alert-text"></span>
        <button id="retry-btn">重试</button>
      </div>

      <section id="market-content"></section>

      <footer class="data-footer">
        <span><i></i> Nasdaq / 东方财富 / Gold API 行情 · 数据仅供参考，不构成投资建议</span>
        <button id="error-demo-btn">检查数据状态</button>
      </footer>
    </div>
  </main>

  <div class="drawer-overlay" id="drawer-overlay" hidden></div>
  <aside class="detail-drawer" id="detail-drawer" aria-hidden="true" aria-label="资产详情">
    <div id="detail-content"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-overlay" id="add-modal" hidden>
    <div class="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
      <div class="add-modal-head">
        <div>
          <h2 id="add-modal-title">添加自选</h2>
          <p id="add-modal-subtitle">支持美股、A 股、港股、指数及加密货币，输入代码或名称即可搜索</p>
        </div>
        <button class="close-btn" id="close-add-modal" aria-label="关闭">×</button>
      </div>
      <label class="add-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="add-search-input" type="search" autocomplete="off" placeholder="例如 TSLA / 600519 / 腾讯 / BTC" />
      </label>
      <div id="add-search-results" class="add-results">
        <div class="add-hint">输入代码或名称开始搜索</div>
      </div>
    </div>
  </div>

    <script src="static-api.js?v=8"></script>
  <script src="app.js?v=20261124-ui-v39"></script>
</body>
</html>
